<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Turbo Rush</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:white;font-family:Arial;text-align:center;overflow:hidden}h1{margin:10px;color:#00eaff;font-style:italic;text-shadow:0 0 15px #00eaff}#hud{display:flex;justify-content:space-around;font-size:18px;padding:8px}canvas{display:block;width:min(100vw,520px);height:65vh;max-height:650px;margin:auto;background:#172b32;border:2px solid #00d9ff;border-radius:10px}#controls{display:flex;justify-content:center;gap:30px;margin:10px}button{background:#00cfe8;border:0;border-radius:14px;padding:14px 25px;font-size:22px;font-weight:bold;color:#03121a;touch-action:manipulation}#start{font-size:17px;padding:10px 22px}#msg{position:absolute;top:42%;left:0;width:100%;font-size:24px;font-weight:bold;text-shadow:0 2px 5px black;pointer-events:none}</style></head><body><h1>🏁 TURBO RUSH</h1><div id="hud"><span>🏆 Score: <b id="score">0</b></span><span>⚡ Speed: <b id="speed">0</b></span></div><canvas id="game" width="480" height="650"></canvas><div id="msg">TAP START TO RACE!</div><div id="controls"><button id="left">⬅️</button><button id="start">START / RESTART</button><button id="right">➡️</button></div><p>Dodge traffic • Use arrows or touch controls</p><script>const c=document.getElementById('game'),x=c.getContext('2d');let player=240,traffic=[],score=0,speed=4,playing=false,frame=0,left=false,right=false;function car(px,py,color,w=42,h=72){x.fillStyle='rgba(0,0,0,.3)';x.fillRect(px-w/2+4,py+5,w,h);x.fillStyle='#111';x.fillRect(px-w/2-4,py+12,8,18);x.fillRect(px+w/2-4,py+12,8,18);x.fillRect(px-w/2-4,py+h-25,8,18);x.fillRect(px+w/2-4,py+h-25,8,18);x.fillStyle=color;x.beginPath();x.roundRect(px-w/2,py,w,h,9);x.fill();x.fillStyle='#aeefff';x.fillRect(px-w/2+7,py+10,w-14,17);x.fillStyle='#fff6a1';x.fillRect(px-w/2+5,py+3,8,5);x.fillRect(px+w/2-13,py+3,8,5);x.fillStyle='#18232a';x.fillRect(px-w/2+7,py+34,w-14,18);x.fillStyle='#ff3030';x.fillRect(px-w/2+5,py+h-7,8,4);x.fillRect(px+w/2-13,py+h-7,8,4)}function draw(){let g=x.createLinearGradient(0,0,0,650);g.addColorStop(0,'#183c35');g.addColorStop(1,'#69a84c');x.fillStyle=g;x.fillRect(0,0,480,650);x.fillStyle='#454952';x.beginPath();x.moveTo(115,0);x.lineTo(365,0);x.lineTo(465,650);x.lineTo(15,650);x.fill();x.fillStyle='#f4f4f4';x.fillRect(112,0,5,650);x.fillRect(363,0,5,650);for(let i=0;i<12;i++){let yy=(i*75+(frame*speed)%75)-30;x.fillStyle='#f6e9bd';x.fillRect(236,yy,8,38);x.fillRect(116,yy,4,25);x.fillRect(360,yy,4,25)}traffic.forEach(t=>car(t.x,t.y,t.color));car(player,540,'#00d9ff',46,78);document.getElementById('score').textContent=score;document.getElementById('speed').textContent=playing?Math.floor(speed*18):0}function reset(){player=240;traffic=[];score=0;speed=4;frame=0;playing=true;document.getElementById('msg').textContent='';loop()}function loop(){if(!playing)return;frame++;if(left)player-=5;if(right)player+=5;player=Math.max(140,Math.min(340,player));if(frame%48===0)traffic.push({x:145+Math.random()*190,y:-90,color:['#ff3939','#ffb52e','#b44dff','#eeeeee'][Math.floor(Math.random()*4)]});traffic.forEach(t=>t.y+=speed);traffic=traffic.filter(t=>t.y<700);for(const t of traffic){if(t.y+65>540&&t.y<620&&Math.abs(t.x-player)<39){playing=false;document.getElementById('msg').textContent='CRASH! SCORE: '+score+' — TAP RESTART';draw();return}}score++;if(frame%600===0)speed=Math.min(10,speed+.5);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=reset;function hold(id,set){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});b.addEventListener('pointerup',()=>set(false));b.addEventListener('pointerleave',()=>set(false));b.addEventListener('pointercancel',()=>set(false))}hold('left',v=>left=v);hold('right',v=>right=v);onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')left=true;if(e.key==='ArrowRight'||e.key==='d')right=true;if(e.key===' '&&!playing)reset()};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false};draw();</script></body></html>
